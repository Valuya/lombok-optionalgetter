name: Build & publish overlay (GitHub Packages)

on:
  # Manual only. Maven Central (see publish-central.yml) is the primary distribution and is what release tags
  # publish to; this GitHub Packages mirror is published on demand to avoid duplicate-version failures on re-tags.
  workflow_dispatch:
    inputs:
      lombok_version:
        description: Upstream lombok version to overlay (blank = pom's lombok.version)
        required: false
        default: ""

jobs:
  build-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Resolve versions
        id: ver
        run: |
          # LOMBOK = upstream version we overlay; RELEASE = the version we publish (its own lane)
          LOMBOK="${{ github.event.inputs.lombok_version }}"
          [ -n "$LOMBOK" ] || LOMBOK="$(mvn -q -DforceStdout help:evaluate -Dexpression=lombok.version)"
          if [ "${{ github.event_name }}" = "push" ]; then
            RELEASE="${GITHUB_REF_NAME#v}"                  # tag v1.18.46.1 -> 1.18.46.1
          else
            RELEASE="$(mvn -q -DforceStdout help:evaluate -Dexpression=revision)"
          fi
          echo "lombok=$LOMBOK"   >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      # build.sh resolves lombok + ecj via Maven; no downloads here.
      - name: Build overlay jar (+ smoke test)
        run: RELEASE_VERSION="${{ steps.ver.outputs.release }}" ./build.sh "${{ steps.ver.outputs.lombok }}"

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.release }}"
          mvn -B -s .github/settings.xml deploy:deploy-file \
            -Drevision="$V" \
            -DpomFile=pom.xml \
            -Dfile="target/lombok-${V}.jar" \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/Valuya/lombok-optionalgetter"
