name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # build.sh resolves lombok + ecj via Maven (preinstalled on the runner); no downloads here.
      - name: Build overlay + smoke test
        run: ./build.sh
